version: '3.8'

services:
  main:
    container_name: nestjs_backend
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .development.env
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5001:5001"
      - "9229:9229"
    command: pnpm run start:dev
    depends_on:
      - postgres
    restart: always

  postgres:
    container_name: nestjs_postgres
    image: postgres:15-alpine
    env_file:
      - .development.env
    environment:
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata: